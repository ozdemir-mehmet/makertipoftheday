name: Re-verify

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  reverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Check expiry dates and buffer depth
        id: check
        run: |
          set +e
          python3 scripts/reverify.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 10 ]; then
            echo "reverify.py exited $rc - the check itself failed, which is not the same as a lapse." >&2
            exit "$rc"
          fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.rc == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Re-verify: tips due or expired"
          body="$(cat reverify-report.md)"
          # Search on the quoted phrase, not a title list with a fixed limit: the phrase form finds the
          # issue whatever else is open, and the quotes stop the colon in the title being parsed as a
          # qualifier (the bare form errors with "The search query contains invalid syntax").
          existing=$(gh issue list --state open --limit 1 \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reverify-report
          path: reverify-report.md
          if-no-files-found: ignore
