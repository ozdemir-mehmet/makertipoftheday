<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }} - {{ site.tagline | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/mark.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/icon-180.png' | relative_url }}">
  <!-- dark first so a browser that ignores `media` keeps the dark value, the safer of the two on either
       background: the light value last would leave a light-mode client with a near-black chrome -->
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

  <meta property="og:type" content="{% if page.tip_number %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/og-default.png' | absolute_url }}">
  <meta property="og:image:alt" content="{{ site.title | escape }} - {{ site.tagline | escape }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
</head>
